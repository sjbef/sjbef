# Build settings live here so the site can be recreated under any Netlify team
# without re-entering them in the UI.
[build]
  command = "npm run build"
  publish = "dist"
  # Skip Markdown/docs/scripts-only changes. For production merges, compare to
  # the first parent: the last build may be a deploy preview of this same code,
  # which would otherwise make CACHED_COMMIT_REF identical to the merge tree
  # and incorrectly skip publishing it to production. For previews, compare to
  # the last built commit as usual.
  ignore = "if [ \"$CONTEXT\" = production ]; then git diff --quiet \"$COMMIT_REF^1\" \"$COMMIT_REF\" -- . ':(exclude,glob)**/*.md' ':(exclude)docs' ':(exclude)scripts' ':(exclude).gitignore' ':(exclude).gitattributes'; else git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude,glob)**/*.md' ':(exclude)docs' ':(exclude)scripts' ':(exclude).gitignore' ':(exclude).gitattributes'; fi"

[build.environment]
  NODE_VERSION = "22"
