<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saint-Jean-Baptiste Educational Foundation | SJBEF</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Netlify Forms detection: the React contact form is rendered client-side,
         so Netlify needs this static copy to register the form and its fields at
         deploy time. Keep the field names in sync with the form in src/App.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="hidden" name="subject" />
      <input type="text" name="topic" />
      <select name="affiliation"></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="volunteer-service" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="volunteer-service" />
      <input type="text" name="student-name" />
      <input name="leadership-1-years" /><input name="leadership-1-organization" /><input name="leadership-1-role" />
      <input name="leadership-2-years" /><input name="leadership-2-organization" /><input name="leadership-2-role" />
      <input name="leadership-3-years" /><input name="leadership-3-organization" /><input name="leadership-3-role" />
      <input name="leadership-4-years" /><input name="leadership-4-organization" /><input name="leadership-4-role" />
      <input name="leadership-5-years" /><input name="leadership-5-organization" /><input name="leadership-5-role" />
      <input name="leadership-6-years" /><input name="leadership-6-organization" /><input name="leadership-6-role" />
      <input name="leadership-7-years" /><input name="leadership-7-organization" /><input name="leadership-7-role" />
      <input name="leadership-8-years" /><input name="leadership-8-organization" /><input name="leadership-8-role" />
      <input name="service-1-years" /><input name="service-1-organization" /><input name="service-1-type" /><textarea name="service-1-contribution"></textarea>
      <input name="service-2-years" /><input name="service-2-organization" /><input name="service-2-type" /><textarea name="service-2-contribution"></textarea>
      <input name="service-3-years" /><input name="service-3-organization" /><input name="service-3-type" /><textarea name="service-3-contribution"></textarea>
      <input name="service-4-years" /><input name="service-4-organization" /><input name="service-4-type" /><textarea name="service-4-contribution"></textarea>
      <input name="service-5-years" /><input name="service-5-organization" /><input name="service-5-type" /><textarea name="service-5-contribution"></textarea>
      <input name="service-6-years" /><input name="service-6-organization" /><input name="service-6-type" /><textarea name="service-6-contribution"></textarea>
      <input name="service-7-years" /><input name="service-7-organization" /><input name="service-7-type" /><textarea name="service-7-contribution"></textarea>
      <input name="service-8-years" /><input name="service-8-organization" /><input name="service-8-type" /><textarea name="service-8-contribution"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
