<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saint-Jean-Baptiste Educational Foundation | SJBEF</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Netlify Forms detection: the React contact form is rendered client-side,
         so Netlify needs this static copy to register the form and its fields at
         deploy time. Keep the field names in sync with the form in src/App.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="hidden" name="subject" />
      <input type="text" name="topic" />
      <select name="affiliation"></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="scholarship-package" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="applicant-name" />
      <input type="email" name="student-email" />
      <input name="member-name" />
      <input name="policy-number" />
      <input type="date" name="date-of-birth" />
      <input name="chapter-number" />
      <input name="mailing-address" />
      <input name="applicant-city" />
      <input name="applicant-state" />
      <input name="applicant-zip" />
      <input type="tel" name="cell-phone" />
      <input type="tel" name="home-phone" />
      <input type="checkbox" name="grade-high-school-senior" value="Yes" />
      <input type="checkbox" name="grade-college-freshman" value="Yes" />
      <input type="checkbox" name="grade-college-sophomore" value="Yes" />
      <input type="checkbox" name="grade-college-junior" value="Yes" />
      <input type="checkbox" name="grade-college-senior" value="Yes" />
      <input name="school-name" />
      <input name="school-city" />
      <input name="school-state" />
      <input type="number" name="tuition-board" />
      <input type="number" name="gpa" />
      <input name="major" />
      <input name="minor" />
      <input type="checkbox" name="application-acknowledgment" value="Agreed" />
      <input name="student-signature" />
      <input type="date" name="signature-date" />
      <input name="leadership-1-years" /><input name="leadership-1-organization" /><input name="leadership-1-role" />
      <input name="leadership-2-years" /><input name="leadership-2-organization" /><input name="leadership-2-role" />
      <input name="leadership-3-years" /><input name="leadership-3-organization" /><input name="leadership-3-role" />
      <input name="leadership-4-years" /><input name="leadership-4-organization" /><input name="leadership-4-role" />
      <input name="leadership-5-years" /><input name="leadership-5-organization" /><input name="leadership-5-role" />
      <input name="leadership-6-years" /><input name="leadership-6-organization" /><input name="leadership-6-role" />
      <input name="leadership-7-years" /><input name="leadership-7-organization" /><input name="leadership-7-role" />
      <input name="leadership-8-years" /><input name="leadership-8-organization" /><input name="leadership-8-role" />
      <input name="service-1-years" /><input name="service-1-organization" /><textarea name="service-1-description"></textarea>
      <input name="service-2-years" /><input name="service-2-organization" /><textarea name="service-2-description"></textarea>
      <input name="service-3-years" /><input name="service-3-organization" /><textarea name="service-3-description"></textarea>
      <input name="service-4-years" /><input name="service-4-organization" /><textarea name="service-4-description"></textarea>
      <input name="service-5-years" /><input name="service-5-organization" /><textarea name="service-5-description"></textarea>
      <input name="service-6-years" /><input name="service-6-organization" /><textarea name="service-6-description"></textarea>
      <input name="service-7-years" /><input name="service-7-organization" /><textarea name="service-7-description"></textarea>
      <input name="service-8-years" /><input name="service-8-organization" /><textarea name="service-8-description"></textarea>
      <input name="bot-field" />
    </form>
    <form name="seminarian-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="first-name" />
      <input name="middle-name" />
      <input name="last-name" />
      <input name="home-address" />
      <input name="home-city" />
      <input name="home-state" />
      <input name="home-zip" />
      <input type="tel" name="home-phone" />
      <input type="tel" name="cell-phone" />
      <input name="date-of-birth" />
      <input name="place-of-birth" />
      <input type="radio" name="cfl-member" value="Yes" />
      <input name="chapter-number" />
      <input name="chapter-city-state" />
      <input name="seminary-name" />
      <input name="seminary-address" />
      <input name="seminary-city" />
      <input name="seminary-state" />
      <input name="seminary-zip" />
      <input type="radio" name="theological-study-year" value="first" />
      <input name="special-study-explanation" />
      <textarea name="accepted-diocese-or-order"></textarea>
      <input name="expected-ordination-date" />
      <input type="radio" name="previous-sjbef-aid" value="Yes" />
      <input name="previous-aid-years" />
      <input name="parent-1-name" />
      <input name="parent-1-address" />
      <input name="parent-1-city-state-zip" />
      <input name="parent-2-name" />
      <input name="parent-2-address" />
      <input name="parent-2-city-state-zip" />
      <input type="number" name="family-dependents" />
      <textarea name="scholarship-check-address"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
